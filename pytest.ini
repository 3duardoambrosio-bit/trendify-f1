[pytest]
norecursedirs = .git .venv __pycache__ .pytest_cache .mypy_cache .ruff_cache .tox node_modules dist build .idea .vscode .tmp _incoming _backup _extracted* _packs S13 S14 S15 .claude .hypothesis S[0-9]*

addopts = -q --import-mode=prepend --ignore=docs/tests
filterwarnings =
    ignore:capital_shield v1 is deprecated, use capital_shield_v2:DeprecationWarning
